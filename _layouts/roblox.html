---
layout: default
---

<article>
    <header class="entry-metadata">
        <h1>{{ page.title }}</h1>

        {% if page.date %}
            <p class="date">
                Reviewed on {{ page.date | date: "%B %-d, %Y" }}
            </p>
        {% endif %}

        {% if page.tags %}
            <p class="tags">
                Tags:
                {% for tag in page.tags %}
                    <a href="{{ '/roblox/tags/' | relative_url }}{{ tag | slugify }}/">
                        {{ tag }}
                    </a>
                {% endfor %}
            </p>
        {% endif %}
    </header>

    <div class="content-body">
        {{ content }}
    </div>
</article>

{% include comments.html %}
