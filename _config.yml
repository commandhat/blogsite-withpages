title: Commandhat's Corner
description: Commandhat's corner for all the little things in life related to a single person.

url: "https://commandhat.com"
baseurl: ""

markdown: kramdown

collections:
  blog:
    output: true
    permalink: /blog/:path/

  projects:
    output: true
    permalink: /projects/:path/

  roblox:
    output: true
    permalink: /roblox/:path/

  about:
    output: true
    permalink: /about/:path/

plugins:
  - jekyll-feed
  - jekyll-archives-v2
  - jekyll-webp
  - jekyll-youtube
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji

feed:
  collections:
    blog:
      path: "/blog/feed.xml"
    roblox:
      path: "/roblox/feed.xml"

jekyll-archives:
  roblox:
    enabled:
      - tags
    layouts:
      tags: roblox-tag
    permalinks:
      tags: /roblox/tags/:name/
